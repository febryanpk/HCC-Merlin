name: hcc-merlin
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - pip:
      # PyTorch built for CUDA 12.4; change the index URL for another CUDA version
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
      - torchvision==0.21.0
      - numpy==1.26.4
      - monai==1.5.0
      - transformers==4.53.0
      - peft==0.17.1
      - deep_pipe==0.5.0
      - huggingface-hub==0.33.2
      - nibabel==5.3.2
      - nltk==3.9.1
      - scikit-learn==1.6.1
      - pandas==2.3.0
      - openpyxl==3.1.5
      - tqdm==4.67.1
      - wandb==0.21.0
